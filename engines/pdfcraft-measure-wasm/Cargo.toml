[package]
name = "pitch_pdfcraft_measure"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
pdfcraft-measure = { path = "../../vendor/pdfcraft/crates/measure" }
pdfcraft-cos = { path = "../../vendor/pdfcraft/crates/cos" }
pdfcraft-annot = { path = "../../vendor/pdfcraft/crates/annot" }
pdfcraft-model = { path = "../../vendor/pdfcraft/crates/model" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
opt-level = "z"
lto = true
