name: Claude AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            src/**/*.{ts,tsx,js,jsx}
            supabase/**/*.ts

      - name: Review with Claude AI
        id: review
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Claude code review skipped: Supabase AI credentials are not configured for this workflow."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff origin/${{ github.base_ref }}..HEAD > pr_diff.txt
          DIFF_CONTENT=$(head -c 60000 pr_diff.txt)
          jq -n \
            --arg diff "$DIFF_CONTENT" \
            '{
              prompt: ("You are an expert code reviewer for a roofing CRM system. Review this diff for security issues, performance concerns, bug risks, and concrete improvements. Focus on genuine production risks.\n\n```diff\n" + $diff + "\n```"),
              model: "anthropic/claude-sonnet-4-5",
              system_prompt: "You are a senior software engineer reviewing code for a production roofing CRM. Focus on critical issues that could cause bugs, security problems, or performance degradation.",
              max_tokens: 8192,
              temperature: 0.3
            }' > review_prompt.json

          if ! REVIEW_RESPONSE=$(curl -sf -X POST \
            "$SUPABASE_URL/functions/v1/ai-claude-processor" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d @review_prompt.json); then
            echo "Claude endpoint unavailable; review skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$REVIEW_RESPONSE" | jq -r '.response // empty' > review.md
          if [ ! -s review.md ]; then
            echo "Claude returned no review content; review skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: steps.changed-files.outputs.any_changed == 'true' && steps.review.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');
            const body = `## 🤖 Claude AI Code Review\n\n${review}\n\n---\n*Powered by Claude Sonnet 4.5 via Lovable AI Gateway*`;
            await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body });

      - name: Check for critical issues
        if: steps.changed-files.outputs.any_changed == 'true' && steps.review.outputs.available == 'true'
        run: |
          if grep -Eqi "security|vulnerability|critical" review.md; then
            echo "::warning::Claude AI detected potential security or critical issues. Review the PR comments."
          fi
