name: Claude AI Bug Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  detect-bugs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect code for analysis
        run: |
          CRITICAL_FILES=(
            "src/features/leads"
            "src/features/jobs"
            "src/features/sales"
            "supabase/functions"
          )
          : > analysis_bundle.txt
          for area in "${CRITICAL_FILES[@]}"; do
            if [ -d "$area" ]; then
              echo "### Analyzing: $area" >> analysis_bundle.txt
              mapfile -t files < <(find "$area" -type f \( -name "*.ts" -o -name "*.tsx" \) | sed -n '1,30p')
              for file in "${files[@]}"; do
                echo "#### File: $file" >> analysis_bundle.txt
                echo '```typescript' >> analysis_bundle.txt
                head -n 200 "$file" >> analysis_bundle.txt
                echo '```' >> analysis_bundle.txt
              done
            fi
          done

      - name: Analyze code for bugs with Claude
        id: analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Claude bug detection skipped: Supabase AI credentials are not configured for this workflow."
            echo "No bugs detected (analysis unavailable: credentials not configured)" > bug_report.md
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODE_CONTENT=$(head -c 50000 analysis_bundle.txt)
          PROMPT="Analyze this code for genuine runtime, logic, data, and security bugs. For each issue provide Severity, Location, Issue, and Fix. Do not report style preferences.\n\n$CODE_CONTENT"

          jq -n \
            --arg prompt "$PROMPT" \
            --arg system "You are an expert bug hunter. Find real bugs that could cause production issues." \
            '{prompt:$prompt,model:"claude-sonnet-4-5",system_prompt:$system,max_tokens:8192,temperature:0.1,feature:"ci-bug-detection"}' > bug_prompt.json

          if ! BUG_RESPONSE=$(curl -sf -X POST \
            "$SUPABASE_URL/functions/v1/ai-claude-processor" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d @bug_prompt.json); then
            echo "Claude endpoint unavailable; treating AI review as skipped."
            echo "No bugs detected (analysis unavailable: endpoint call failed)" > bug_report.md
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$BUG_RESPONSE" | jq -r '.response // "No bugs detected"' > bug_report.md
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Parse bug severity
        id: severity
        run: |
          CRITICAL_COUNT=$(grep -ci "Critical" bug_report.md 2>/dev/null || true)
          HIGH_COUNT=$(grep -ci "High" bug_report.md 2>/dev/null || true)
          CRITICAL_COUNT=${CRITICAL_COUNT:-0}
          HIGH_COUNT=${HIGH_COUNT:-0}
          echo "critical=$CRITICAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            echo "issues_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "issues_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub issues for critical bugs
        if: steps.analysis.outputs.available == 'true' && steps.severity.outputs.issues_found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const bugReport = fs.readFileSync('bug_report.md', 'utf8');
            const existingIssues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'bug,claude-ai-detected' });
            const today = new Date().toISOString().split('T')[0];
            const issueTitle = `🐛 Claude AI Bug Detection Report - ${today}`;
            if (!existingIssues.data.some(issue => issue.title.includes(today))) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: issueTitle, body: `## 🐛 Automated Bug Detection Report\n\n${bugReport.substring(0, 60000)}\n\n---\n*Detected by Claude AI*`, labels: ['bug', 'claude-ai-detected', 'needs-triage'] });
            }

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.analysis.outputs.available == 'true' && steps.severity.outputs.issues_found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const bugReport = fs.readFileSync('bug_report.md', 'utf8');
            await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body: `## ⚠️ Claude AI Bug Detection\n\n${bugReport.substring(0, 60000)}\n\n---\n*Powered by Claude AI*` });
